# GENERATED by the govchat command. Do not edit. Change the input files and run: ./govchat build
librechat:
  configYamlContent: |
    version: 1.3.19
    cache: true

    # The core is chat only. Everything else is off until there is a decision to turn it on.
    interface:
      modelSelect: false
      parameters: false
      presets: false
      multiConvo: false
      agents: false
      prompts: false
      bookmarks: false
      memories: false
      runCode: false
      webSearch: false
      fileSearch: false
      fileCitations: false
      skills: false
      sharedLinks: false
      schedules: false
      feedback: false
      buildInfo: false
      autoSubmitFromUrl: false
      marketplace: { use: false }
      mcpServers: { use: true, create: false, share: false, public: false }
      remoteAgents: { use: false, create: false, share: false, public: false }
      peoplePicker: { users: false, groups: false, roles: false }
      temporaryChat: true
      retentionMode: all # every conversation gets an expiry date
      generalChatRetention: 720 # hours: 30 days
      temporaryChatRetention: 720

    registration:
      socialLogins:
        - openid

    # Speech off: the browser's speech recognition can send audio to the browser vendor.
    speech:
      speechTab:
        conversationMode: false
        speechToText: false
        textToSpeech: false

    # No uploads in the core.
    fileConfig:
      endpoints:
        default:
          disabled: true

    endpoints:
      azureOpenAI:
        titleModel: "current_model"
        groups:
          - group: "govchat"
            apiKey: "${AZURE_MODEL_KEY}"
            instanceName: "${AZURE_INSTANCE_NAME}"
            version: "${AZURE_API_VERSION}"
            baseURL: "${AZURE_BASE_URL}"
            models:
              govchat-standaard:
                deploymentName: "${AZURE_DEPLOYMENT_NAME}"

    # One fixed assistant. A new assistant is a new entry in this list.
    modelSpecs:
      enforce: true
      prioritize: true
      list:
        - name: govchat-standaard
          label: "GovChat standaard"
          default: true
          description: "Algemene chat. Geen persoonsgegevens invoeren."
          preset:
            endpoint: "azureOpenAI"
            model: "govchat-standaard"
            modelLabel: "GovChat"
            promptPrefix: |
              Je bent GovChat, een AI-assistent voor medewerkers van een Nederlandse overheidsorganisatie. Je antwoordt in helder Nederlands, tenzij de gebruiker om een andere taal vraagt.

              Persoonsgegevens horen niet in dit gesprek. Bevat een bericht van de gebruiker gegevens waarmee een persoon te herkennen is (zoals een naam met adres, een BSN, een geboortedatum, een telefoonnummer, een e-mailadres van een inwoner, of gegevens over gezondheid, schulden of strafrecht), begin je antwoord dan met deze waarschuwing: "Let op: dit bericht lijkt persoonsgegevens te bevatten. Voer geen persoonsgegevens in GovChat in. Haal ze weg of maak ze anoniem." Herhaal de persoonsgegevens niet in je antwoord en help verder alleen met het deel van de vraag dat zonder die gegevens te beantwoorden is.

              Je kunt fouten maken. Zeg het als je iets niet zeker weet, en verzin geen bronnen, wetsartikelen of cijfers.
          mcpServers:
            - time
    mcpSettings:
      allowedAddresses:
        - time:8080
    mcpServers:
      time:
        type: streamable-http
        url: http://time:8080/mcp
        title: Datum en tijd
        chatMenu: false
