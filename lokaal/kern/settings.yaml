# The settings of the kern for a local test on your own computer.
# No ingress, a local account as a replacement for Entra ID, and the replacement model
# and the database from kern/local-services.yaml.

mongodb:
  enabled: false

ingress:
  enabled: false

librechat:
  configEnv:
    MONGO_URI: "mongodb://mongodb:27017/LibreChat"
    DOMAIN_CLIENT: "http://localhost:3080"
    DOMAIN_SERVER: "http://localhost:3080"
    ALLOW_EMAIL_LOGIN: "true"
    ALLOW_REGISTRATION: "true"
    ALLOW_SOCIAL_LOGIN: "false"
    OPENID_AUTO_REDIRECT: "false"
    AZURE_INSTANCE_NAME: "local"
    AZURE_DEPLOYMENT_NAME: "test-model"
    AZURE_API_VERSION: "2024-10-21"
    AZURE_BASE_URL: "http://stub-model:8080/openai/deployments/test-model"
